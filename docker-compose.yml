# Start vault server locally for the purposes of integration tests.
version: "3.0"
services:
  vault:
    image: hashicorp/vault:latest
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: testtoken
      SKIP_SETCAP: "true"
      VAULT_LOCAL_CONFIG: '{"disable_mlock": true}'
    ports:
      - 8200:8200
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 1s
      timeout: 5s
      retries: 5
  vault-enterprise:
    image: hashicorp/vault-enterprise:latest
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: testtoken
      VAULT_LICENSE: ${VAULT_LICENSE_CI}
      SKIP_SETCAP: "true"
      VAULT_LOCAL_CONFIG: '{"disable_mlock": true}'
    ports:
      - 8200:8200
    privileged: true
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 1s
      timeout: 5s
      retries: 30
  vault-tls:
    image: hashicorp/vault:latest
    hostname: vault-tls
    environment:
      VAULT_CAPATH: /etc/vault/ca.crt
      SKIP_SETCAP: "true"
      VAULT_LOCAL_CONFIG: '{"disable_mlock": true}'
    ports:
    - 8200:8200
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=https://127.0.0.1:8200 VAULT_CACERT=/etc/vault/ca.crt vault status; s=$?; [ $s -eq 0 ] || [ $s -eq 2 ]"]
      interval: 1s
      timeout: 5s
      retries: 30
    volumes:
    - ${PWD}/integrationTests/e2e-tls/configs:/etc/vault
    entrypoint: vault server -config=/etc/vault/config.hcl

